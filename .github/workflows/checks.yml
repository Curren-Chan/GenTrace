name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        shell: cmd
        env:
          PYTHONUTF8: '1'
        run: run_tests.cmd
      - name: Publication audit
        run: python scripts/publication_audit.py --staged
      - name: Whitespace check
        run: git diff --check
